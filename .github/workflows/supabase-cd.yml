name: Build deployment images
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run test:python
      - name: Build app image
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: docker build --target app --build-arg NEXT_PUBLIC_SUPABASE_URL --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY -t meip-app .
      - run: docker build --target worker -t meip-worker .
      - run: docker save meip-app meip-worker | gzip > meip-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: meip-images
          path: meip-images.tar.gz
