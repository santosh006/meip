name: Deploy Supabase Database Migration & Build Application

on:
  push:
    branches:
      - dev_branch
      - uat_branch
      - main
    paths:
      - 'supabase/**'
      - 'src/**'
      - 'package*.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref_name }}" = "dev_branch" ] || [ "${{ github.ref_name }}" = "uat_branch" ]; then
            echo "PROJECT_ID=${{ secrets.SUPABASE_NON_PROD_PROJECT_ID }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.SUPABASE_NON_PROD_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL_NONPROD }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_NONPROD }}" >> $GITHUB_ENV
            echo "ENV_NAME=Non-Production (${{ github.ref_name }})" >> $GITHUB_ENV
            echo "VERCEL_ENV=preview" >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "PROJECT_ID=${{ secrets.SUPABASE_PROD_PROJECT_ID }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.SUPABASE_PROD_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL_PROD }}" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_PROD }}" >> $GITHUB_ENV
            echo "ENV_NAME=Production" >> $GITHUB_ENV
            echo "VERCEL_ENV=production" >> $GITHUB_ENV
          fi

      - name: Push Migrations to ${{ env.ENV_NAME }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${{ env.PROJECT_ID }}" ] || [ -z "${{ env.DB_PASSWORD }}" ]; then
            echo "ERROR: PROJECT_ID or DB_PASSWORD not set."
            exit 1
          fi
          supabase link --project-ref ${{ env.PROJECT_ID }} -p ${{ env.DB_PASSWORD }}
          supabase db push

      - name: Install Dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Build & Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          PROD_FLAG=""
          if [ "${{ env.VERCEL_ENV }}" = "production" ]; then
            PROD_FLAG="--prod"
          fi

          vercel deploy $PROD_FLAG \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --build-env NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --env NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }} \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
