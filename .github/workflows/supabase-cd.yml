name: Supabase CD

on:
  push:
    branches:
      - main
      - dev
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install Supabase CLI
        run: |
          curl -sSfL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar xz
          sudo mv supabase /usr/local/bin/supabase

      - name: Set environment target
        id: env_target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "VERCEL_ENV=production" >> $GITHUB_OUTPUT
            echo "IS_PROD=true" >> $GITHUB_OUTPUT
          else
            echo "VERCEL_ENV=preview" >> $GITHUB_OUTPUT
            echo "IS_PROD=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel Environment
        run: |
          vercel pull --yes \
            --environment=${{ steps.env_target.outputs.VERCEL_ENV }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Load env vars from Vercel
        run: |
          ENV_FILE=".vercel/.env.${{ steps.env_target.outputs.VERCEL_ENV }}.local"
          if [ -f "$ENV_FILE" ]; then
            export $(grep -v '^#' "$ENV_FILE" | xargs)
            echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >> $GITHUB_ENV
          else
            echo "Env file not found: $ENV_FILE"
            exit 1
          fi

      - name: Run Supabase Migrations
        run: |
          supabase db push --db-url "${{ env.SUPABASE_DB_URL }}"

      - name: Build
        run: |
          if [ "${{ steps.env_target.outputs.IS_PROD }}" = "true" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy Prebuilt
        run: |
          if [ "${{ steps.env_target.outputs.IS_PROD }}" = "true" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
