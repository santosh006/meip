      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Project Info
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Set Supabase Env Vars in Vercel Project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TARGET_ENV="preview"
          if [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_ENV="production"
          fi

          # Remove old values if they exist, then re-add with correct values for the branch
          vercel env rm NEXT_PUBLIC_SUPABASE_URL $TARGET_ENV --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm NEXT_PUBLIC_SUPABASE_ANON_KEY $TARGET_ENV --yes --token=${{ secrets.VERCEL_TOKEN }} || true

          echo "${{ env.NEXT_PUBLIC_SUPABASE_URL }}" | vercel env add NEXT_PUBLIC_SUPABASE_URL $TARGET_ENV --token=${{ secrets.VERCEL_TOKEN }}
          echo "${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" | vercel env add NEXT_PUBLIC_SUPABASE_ANON_KEY $TARGET_ENV --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}
          fi
