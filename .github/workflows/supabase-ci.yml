name: Supabase CI

on:
  pull_request:
    branches:
      - main
      - dev
      - uat

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meip_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python regression tests
        run: npm run test:python

      - name: Production build
        run: npm run build

      - name: Fresh migration and database contract checks
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meip_test
        run: bash scripts/test-migrations.sh
